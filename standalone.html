<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloodWise — Ultra-Clean Urban Flood Safety AI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Outfit & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 18, 30, 0.78);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      color: #f8fafc;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.02em;
    }

    .glass-card {
      background: rgba(13, 18, 30, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .glass-input {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
    }
    .glass-input:focus-within {
      border-color: rgba(6, 182, 212, 0.6);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(6, 182, 212, 0.4);
      transform: translateY(-1px);
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background-color: #060911 !important;
      font-family: inherit;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(13, 18, 30, 0.94) !important;
      color: #f8fafc !important;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7) !important;
    }
    .leaflet-popup-tip {
      background: rgba(13, 18, 30, 0.94) !important;
    }

    .glow-safe {
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
    }
    .glow-hazard {
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.25);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(7, 9, 14, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.7);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.8);
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CITIES = [
      { id: 'kolkata', name: 'Kolkata, IN', center: [22.5726, 88.3639], zoom: 12 },
      { id: 'mumbai', name: 'Mumbai, IN', center: [19.0760, 72.8777], zoom: 12 },
      { id: 'nyc', name: 'New York City, US', center: [40.7128, -74.0060], zoom: 12 }
    ];

    const PRESETS = [
      { cityId: 'kolkata', text: "How do I get from Salt Lake to Howrah avoiding flooded roads?", label: "Salt Lake ➔ Howrah" },
      { cityId: 'kolkata', text: "Is Park Street to Airport safe for a motorcycle right now?", label: "Park St ➔ Airport" },
      { cityId: 'mumbai', text: "Navigate from Hindmata to BKC avoiding waterlogged spots", label: "Hindmata ➔ BKC" }
    ];

    const FLOOD_ZONES = [
      {
        id: 'fz-1',
        name: 'Ultadanga Rail Underpass Basin',
        severity: 'HIGH',
        waterDepthCm: 55,
        description: 'Severe waterlogging under railway bridge due to heavy storm runoff.',
        coordinates: [[22.5830, 88.3980], [22.5890, 88.4050], [22.5860, 88.4120], [22.5790, 88.4050], [22.5830, 88.3980]]
      },
      {
        id: 'fz-2',
        name: 'College Street Canal Corridor',
        severity: 'HIGH',
        waterDepthCm: 42,
        description: 'Tram line drainage overflow, impassable for small light cars.',
        coordinates: [[22.5710, 88.3610], [22.5770, 88.3650], [22.5740, 88.3710], [22.5680, 88.3670], [22.5710, 88.3610]]
      }
    ];

    const VEHICLE_SPECS = {
      car: { name: 'Sedan / Car', clearanceCm: 32, icon: '🚗' },
      motorcycle: { name: 'Two-Wheeler / Bike', clearanceCm: 22, icon: '🏍️' },
      walking: { name: 'Pedestrian', clearanceCm: 15, icon: '🚶' },
      emergency: { name: 'SUV / Ambulance', clearanceCm: 55, icon: '🚑' }
    };

    function App() {
      const [city, setCity] = useState(CITIES[0]);
      const [queryText, setQueryText] = useState("How do I get from Salt Lake to Howrah avoiding flooded roads?");
      const [selectedMode, setSelectedMode] = useState('car');
      const [rainLevel, setRainLevel] = useState('heavy');
      const [selectedRouteId, setSelectedRouteId] = useState('route-safe');
      
      const [isListening, setIsListening] = useState(false);
      const [clickToReportMode, setClickToReportMode] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [pendingCoords, setPendingCoords] = useState(null);

      const [crowdReports, setCrowdReports] = useState([
        { id: '1', coords: [22.5835, 88.4020], locationName: 'Ultadanga Underpass', waterDepth: '55 cm', notes: 'Thigh deep water! Bikes stalling.', timeAgo: '8m ago' }
      ]);

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);

      const routesData = {
        originName: 'Salt Lake City',
        originCoords: [22.5800, 88.4170],
        destName: 'Howrah Station',
        destCoords: [22.5840, 88.3420],
        safeRoute: {
          id: 'route-safe',
          name: 'Recommended Safe Detour (via Belgachia Flyover)',
          distanceKm: 11.2,
          etaMins: 32,
          riskScore: 16,
          maxWaterDepth: '5 cm',
          stallDanger: false,
          coordinates: [
            [22.5800, 88.4170], [22.5930, 88.4100], [22.6010, 88.3880], [22.5960, 88.3600], [22.5880, 88.3480], [22.5840, 88.3420]
          ]
        },
        directRoute: {
          id: 'route-direct',
          name: 'Direct Route (via Ultadanga Main Rd)',
          distanceKm: 9.8,
          etaMins: 45,
          riskScore: 78,
          maxWaterDepth: '55 cm',
          stallDanger: 55 > VEHICLE_SPECS[selectedMode].clearanceCm,
          coordinates: [
            [22.5800, 88.4170], [22.5830, 88.4050], [22.5860, 88.3880], [22.5740, 88.3680], [22.5770, 88.3520], [22.5840, 88.3420]
          ]
        }
      };

      const handleVoiceInput = () => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SpeechRecognition();
          rec.onstart = () => setIsListening(true);
          rec.onresult = (e) => {
            setQueryText(e.results[0][0].transcript);
            setIsListening(false);
          };
          rec.onend = () => setIsListening(false);
          rec.start();
        } else {
          setIsListening(true);
          setTimeout(() => {
            setQueryText("How do I get from Salt Lake to Howrah avoiding flooded roads?");
            setIsListening(false);
          }, 1000);
        }
      };

      useEffect(() => {
        if (!mapRef.current) return;
        if (mapInstanceRef.current) mapInstanceRef.current.remove();

        const map = L.map(mapRef.current, { zoomControl: false }).setView(city.center, city.zoom);
        mapInstanceRef.current = map;
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        map.on('click', (e) => {
          if (clickToReportMode) {
            setPendingCoords([e.latlng.lat, e.latlng.lng]);
            setShowReportModal(true);
            setClickToReportMode(false);
          }
        });

        FLOOD_ZONES.forEach(zone => {
          const isHigh = zone.severity === 'HIGH';
          const p = L.polygon(zone.coordinates, {
            color: isHigh ? '#f43f5e' : '#f59e0b',
            fillColor: isHigh ? '#f43f5e' : '#f59e0b',
            fillOpacity: isHigh ? 0.4 : 0.25,
            weight: isHigh ? 2.5 : 1.5,
            dashArray: '6, 6'
          }).addTo(map);

          p.bindPopup(`
            <div style="padding:4px">
              <strong style="color:#f43f5e;font-size:13px;font-weight:700">${zone.name}</strong><br/>
              <span style="font-size:11px;color:#94a3b8">Water Depth: <strong style="color:#f43f5e">${zone.waterDepthCm} cm</strong></span>
              <p style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.3">${zone.description}</p>
            </div>
          `);
        });

        const safePoly = L.polyline(routesData.safeRoute.coordinates, {
          color: selectedRouteId === 'route-safe' ? '#10b981' : '#334155',
          weight: selectedRouteId === 'route-safe' ? 6 : 3,
          opacity: selectedRouteId === 'route-safe' ? 0.95 : 0.4
        }).addTo(map);

        const directPoly = L.polyline(routesData.directRoute.coordinates, {
          color: selectedRouteId === 'route-direct' ? '#f43f5e' : '#334155',
          weight: selectedRouteId === 'route-direct' ? 6 : 3,
          dashArray: '8, 8',
          opacity: selectedRouteId === 'route-direct' ? 0.95 : 0.4
        }).addTo(map);

        safePoly.on('click', () => setSelectedRouteId('route-safe'));
        directPoly.on('click', () => setSelectedRouteId('route-direct'));

        L.circleMarker(routesData.originCoords, { radius: 8, color: '#10b981', fillColor: '#10b981', fillOpacity: 1 }).addTo(map).bindPopup("Start: Salt Lake");
        L.circleMarker(routesData.destCoords, { radius: 8, color: '#06b6d4', fillColor: '#06b6d4', fillOpacity: 1 }).addTo(map).bindPopup("End: Howrah");

        crowdReports.forEach(r => {
          L.circleMarker(r.coords, { radius: 7, color: '#f43f5e', fillColor: '#f43f5e', fillOpacity: 0.9 }).addTo(map).bindPopup(`⚠️ <b>${r.locationName}</b><br/>Depth: ${r.waterDepth}<br/><i>"${r.notes}"</i>`);
        });

        return () => map.remove();
      }, [city, selectedRouteId, crowdReports, clickToReportMode]);

      return (
        <div className="flex-1 flex flex-col">
          
          {/* Header */}
          <header className="sticky top-0 z-40 glass-card rounded-none border-b border-slate-800/80 px-5 py-3 shadow-xl">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/20">
                  🌊
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-extrabold text-white tracking-tight">FloodWise</h1>
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 uppercase tracking-widest">
                      Live AI Route Safety
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Urban Flood Risk Aware Navigation System</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs">
                <select 
                  value={city.id} 
                  onChange={(e) => setCity(CITIES.find(c => c.id === e.target.value))}
                  className="bg-slate-900/90 border border-slate-800 text-slate-200 rounded-xl px-3 py-1.5 font-medium focus:outline-none cursor-pointer"
                >
                  {CITIES.map(c => <option key={c.id} value={c.id} className="bg-slate-900">{c.name}</option>)}
                </select>

                <select 
                  value={rainLevel} 
                  onChange={(e) => setRainLevel(e.target.value)}
                  className="bg-slate-900/90 border border-slate-800 text-cyan-300 font-semibold rounded-xl px-3 py-1.5 focus:outline-none cursor-pointer"
                >
                  <option value="light" className="bg-slate-900">Light Rain (5mm/h)</option>
                  <option value="moderate" className="bg-slate-900">Moderate (18mm/h)</option>
                  <option value="heavy" className="bg-slate-900">Heavy Downpour (45mm/h)</option>
                  <option value="torrential" className="bg-slate-900">Torrential Storm (85mm/h)</option>
                </select>

                <button 
                  onClick={() => {
                    setClickToReportMode(!clickToReportMode);
                    if (!clickToReportMode) alert("Click anywhere on the map to drop a flood hazard pin!");
                  }}
                  className={`px-3.5 py-1.5 rounded-xl font-semibold transition border ${
                    clickToReportMode 
                      ? 'bg-rose-500 text-white border-rose-400 shadow-lg shadow-rose-500/30 animate-pulse' 
                      : 'bg-slate-900/80 text-rose-400 border-rose-500/30 hover:bg-rose-500/10'
                  }`}
                >
                  {clickToReportMode ? '📍 Click Map to Drop Pin' : '+ Report Hazard'}
                </button>

                <button 
                  onClick={() => setShowShareModal(true)}
                  className="px-3 py-1.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 font-medium border border-slate-800 transition"
                >
                  📲 SMS Export
                </button>
              </div>

            </div>
          </header>

          {/* Main Container Stack */}
          <main className="max-w-7xl w-full mx-auto p-4 space-y-4 flex-1">
            
            {/* Weather Alert Bar */}
            <div className="p-2.5 rounded-2xl glass-card border-amber-500/30 bg-gradient-to-r from-amber-500/10 via-slate-900/90 to-rose-500/10 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-2.5">
                <span className="text-amber-400 text-base">⚠️</span>
                <div>
                  <span className="font-extrabold text-amber-400 uppercase tracking-wider">Monsoon Alert:</span>
                  <span className="text-slate-300 ml-1.5">Surface runoff causing underpass submergence. Detour routes active.</span>
                </div>
              </div>
              <div className="font-mono text-cyan-300 bg-cyan-500/10 px-3 py-0.5 rounded-xl border border-cyan-500/20 text-[11px]">
                Precipitation: <strong>45 mm/hr</strong>
              </div>
            </div>

            {/* Natural Language Input Bar */}
            <div className="glass-input p-1.5 rounded-2xl flex items-center gap-2 shadow-2xl transition">
              <span className="pl-3 text-cyan-400 text-base">✨</span>
              <input
                type="text"
                value={queryText}
                onChange={(e) => setQueryText(e.target.value)}
                placeholder="Type travel request in plain English (e.g. How do I get from Salt Lake to Howrah avoiding flooded roads?)..."
                className="w-full bg-transparent text-xs sm:text-sm text-slate-100 placeholder-slate-400 focus:outline-none font-medium py-1.5"
              />
              
              <button 
                onClick={handleVoiceInput}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 transition ${
                  isListening ? 'bg-rose-500 text-white animate-bounce' : 'bg-slate-800 text-slate-300 hover:text-cyan-400'
                }`}
              >
                🎙️ {isListening ? 'Listening...' : 'Voice'}
              </button>

              <button 
                onClick={() => setSelectedRouteId('route-safe')}
                className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-slate-950 font-extrabold text-xs shadow-lg shadow-cyan-500/20 transition transform hover:scale-[1.02]"
              >
                Route
              </button>
            </div>

            {/* Presets & Transport Modes */}
            <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="text-slate-400 font-semibold text-[11px] uppercase tracking-wider">Demo Presets:</span>
                {PRESETS.map((p, idx) => (
                  <button
                    key={idx}
                    onClick={() => setQueryText(p.text)}
                    className="glass-pill px-2.5 py-0.5 text-slate-300 text-xs font-medium rounded-lg"
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              {/* Vehicle Mode Switcher */}
              <div className="flex items-center gap-1 bg-slate-900/90 border border-slate-800 p-1 rounded-xl">
                {Object.keys(VEHICLE_SPECS).map(modeKey => {
                  const spec = VEHICLE_SPECS[modeKey];
                  const isSel = selectedMode === modeKey;
                  return (
                    <button
                      key={modeKey}
                      onClick={() => setSelectedMode(modeKey)}
                      className={`px-2.5 py-0.5 rounded-lg flex items-center gap-1.5 font-medium transition ${
                        isSel ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <span>{spec.icon}</span>
                      <span className="hidden sm:inline">{spec.name.split('/')[0]}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 1. COMPACT MAP VIEW (TOP SECTION - COMPACT HEIGHT: 350px) */}
            <div className="w-full h-[350px] rounded-2xl overflow-hidden glass-card relative border border-slate-800/80 shadow-xl">
              <div ref={mapRef} className="w-full h-full"></div>
              
              <div className="absolute top-3 left-3 z-[400] glass-pill px-2.5 py-1 rounded-xl text-[11px] font-semibold text-slate-200 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Spatial Risk Engine Active</span>
              </div>

              <div className="absolute bottom-3 left-3 z-[400] glass-card p-2 rounded-xl text-[10px] space-y-0.5 shadow-xl border-slate-800">
                <div className="text-emerald-400 flex items-center gap-1">🟢 Safe Detour</div>
                <div className="text-rose-400 flex items-center gap-1">🔴 Flooded Path</div>
                <div className="text-amber-400 flex items-center gap-1">⚠️ Submerged Zone</div>
              </div>
            </div>

            {/* 2. ROUTE SAFETY COMPARISON (BOTTOM SECTION - DIRECTLY BELOW COMPACT MAP) */}
            <div className="w-full space-y-3 pt-1">
              
              <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                <div>
                  <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                    🗺️ Route Risk & Safety Analysis
                  </h2>
                </div>
                <span className="text-xs px-2.5 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-mono">
                  Clearance: {VEHICLE_SPECS[selectedMode].clearanceCm}cm
                </span>
              </div>

              {/* Grid of Candidate Route Cards */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                
                {/* Safe Route Card */}
                <div 
                  onClick={() => setSelectedRouteId('route-safe')}
                  className={`p-4 rounded-2xl glass-card cursor-pointer transition relative overflow-hidden ${
                    selectedRouteId === 'route-safe' 
                      ? 'border-emerald-500/80 bg-slate-900/90 glow-safe ring-2 ring-emerald-500/20' 
                      : 'border-slate-800/80 bg-slate-900/40 hover:bg-slate-900/70'
                  }`}
                >
                  <div className="absolute top-0 right-0 bg-gradient-to-l from-emerald-500 to-teal-400 text-slate-950 text-[10px] font-extrabold px-3 py-0.5 rounded-bl-xl uppercase tracking-wider shadow">
                    ★ RECOMMENDED SAFE DETOUR
                  </div>

                  <h3 className="font-bold text-sm text-slate-100 pr-12">{routesData.safeRoute.name}</h3>

                  <div className="flex flex-wrap items-center gap-3 my-2 py-2 px-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs">
                    <div>ETA: <strong className="text-slate-100">{routesData.safeRoute.etaMins} mins</strong></div>
                    <div className="h-3 w-px bg-slate-800"></div>
                    <div>Distance: <strong className="text-slate-100">{routesData.safeRoute.distanceKm} km</strong></div>
                    <div className="h-3 w-px bg-slate-800"></div>
                    <div>Safety Score: <strong className="text-emerald-400">{routesData.safeRoute.riskScore}/100 (LOW)</strong></div>
                  </div>

                  <div className="text-xs text-emerald-400 flex items-center gap-1.5 bg-emerald-500/10 p-2 rounded-xl border border-emerald-500/20">
                    ✅ Completely circumvents high-risk submerged basins via elevated flyover path.
                  </div>
                </div>

                {/* Direct High Risk Route Card */}
                <div 
                  onClick={() => setSelectedRouteId('route-direct')}
                  className={`p-4 rounded-2xl glass-card cursor-pointer transition relative overflow-hidden ${
                    selectedRouteId === 'route-direct' 
                      ? 'border-rose-500/80 bg-slate-900/90 glow-hazard ring-2 ring-rose-500/20' 
                      : 'border-slate-800/80 bg-slate-900/40 hover:bg-slate-900/70'
                  }`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10px] font-extrabold text-rose-400 uppercase tracking-wider">⚠️ HIGH FLOOD HAZARD</span>
                    <span className="text-xs font-bold text-rose-400">Risk Score: {routesData.directRoute.riskScore}/100</span>
                  </div>

                  <h3 className="font-bold text-sm text-slate-100">{routesData.directRoute.name}</h3>

                  <div className="flex flex-wrap items-center gap-3 my-2 py-2 px-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs">
                    <div>ETA: <strong className="text-slate-100">{routesData.directRoute.etaMins} mins</strong></div>
                    <div className="h-3 w-px bg-slate-800"></div>
                    <div>Distance: <strong className="text-slate-100">{routesData.directRoute.distanceKm} km</strong></div>
                    <div className="h-3 w-px bg-slate-800"></div>
                    <div>Max Depth: <strong className="text-rose-400">{routesData.directRoute.maxWaterDepth}</strong></div>
                  </div>

                  {routesData.directRoute.stallDanger ? (
                    <div className="text-xs text-rose-300 space-y-1 bg-rose-500/15 p-2.5 rounded-xl border border-rose-500/30">
                      <div className="font-extrabold text-rose-400 flex items-center gap-1">
                        🚨 VEHICLE STALL RISK DETECTED
                      </div>
                      <p className="text-[11px] leading-snug">
                        Water depth (55cm) exceeds {VEHICLE_SPECS[selectedMode].name} intake height ({VEHICLE_SPECS[selectedMode].clearanceCm}cm). Engine stall likely!
                      </p>
                    </div>
                  ) : (
                    <div className="text-xs text-amber-300 bg-amber-500/10 p-2 rounded-xl border border-amber-500/20">
                      ⚠️ Passes through 2 submerged flood zones. Slow traffic.
                    </div>
                  )}
                </div>

              </div>

              {/* AI Reasoning Note Box */}
              <div className="p-3.5 rounded-2xl glass-card border-cyan-500/30 bg-slate-900/90 space-y-1.5">
                <div className="flex items-center justify-between border-b border-slate-800 pb-1.5">
                  <span className="font-bold text-xs text-cyan-300 flex items-center gap-1.5">
                    ✨ AI Safety Reasoning Note
                  </span>
                  <span className="text-[10px] bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 px-2 py-0.5 rounded font-mono">
                    LLM Guidance Engine
                  </span>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  The direct path crosses the <strong>Ultadanga Rail Underpass</strong> where water levels have reached <strong>55 cm</strong> due to heavy monsoon downpour. Re-routing via Belgachia Flyover adds 1.4 km, but saves ~13 minutes by avoiding stranded gridlock.
                </p>
              </div>

            </div>

          </main>

          {/* Crowdsourcing Modal */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-md glass-card p-6 border border-slate-700 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-rose-400 text-sm flex items-center gap-2">
                    📍 Broadcast Citizen Flood Report
                  </h3>
                  <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const loc = e.target.loc.value || 'Reported Hazard Spot';
                  const depth = e.target.depth.value;
                  const notes = e.target.notes.value || 'Submerged road';
                  const coords = pendingCoords || [city.center[0] + 0.01, city.center[1] + 0.01];

                  setCrowdReports([{ id: Date.now().toString(), coords, locationName: loc, waterDepth: depth, notes, timeAgo: 'Just now' }, ...crowdReports]);
                  setShowReportModal(false);
                }} className="space-y-3 text-xs">

                  <div>
                    <label className="font-semibold text-slate-300">Landmark / Location Name</label>
                    <input name="loc" type="text" required placeholder="e.g. Sector V Underpass" className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-cyan-500 mt-1" />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-300">Water Depth</label>
                    <select name="depth" className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-cyan-500 mt-1">
                      <option>25 cm (Wheel height water)</option>
                      <option>55 cm (Thigh deep water)</option>
                      <option>75 cm+ (Fully submerged road)</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-300">Driver Notes</label>
                    <textarea name="notes" placeholder="Describe hazard status..." className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-cyan-500 mt-1" rows={2}></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowReportModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-semibold rounded-xl">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-gradient-to-r from-rose-600 to-amber-600 text-white font-extrabold rounded-xl shadow-lg shadow-rose-600/30">
                      Broadcast Alert
                    </button>
                  </div>

                </form>

              </div>
            </div>
          )}

          {/* Emergency Offline Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-md glass-card p-6 border border-slate-700 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-cyan-400 text-sm">📲 Emergency Offline SMS Export</h3>
                  <button onClick={() => setShowShareModal(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <div className="bg-slate-950 p-4 rounded-2xl font-mono text-xs text-slate-200 border border-slate-800 whitespace-pre-wrap leading-relaxed">
                  [FLOODWISE EMERGENCY ROUTE]
                  From: Salt Lake to Howrah Station
                  Recommended: Belgachia Flyover (SAFE - Score 16/100)
                  Avoid: Ultadanga Underpass (55cm Submerged)
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => {
                      navigator.clipboard.writeText("[FLOODWISE ROUTE] Take Belgachia Flyover (SAFE). Avoid Ultadanga Underpass (55cm submerged).");
                      alert("Copied SMS text to clipboard!");
                    }}
                    className="px-4 py-2 bg-slate-800 text-cyan-400 font-bold text-xs rounded-xl border border-slate-700 hover:bg-slate-700"
                  >
                    Copy SMS Text
                  </button>
                  <button onClick={() => setShowShareModal(false)} className="px-4 py-2 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl">Done</button>
                </div>
              </div>
            </div>
          )}

          <footer className="glass-card rounded-none border-t border-slate-800/80 p-4 text-center text-xs text-slate-500">
            FloodWise Urban Flood Navigation System • Societal Benefit AI Architecture
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
